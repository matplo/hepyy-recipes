name: Native wheels
on:
  push:
    branches: [main, 'feature/native-wheels', 'feature/hepbundle-wheels']
    paths: ['wheels/**', '.github/workflows/native-wheels.yml', 'fastjet/**', 'fjcontrib/**', 'pythia8/**', 'hepbundle/**', 'hepmc3/**', 'lhapdf/**']
  pull_request:
    paths: ['wheels/**', '.github/workflows/native-wheels.yml', 'fastjet/**', 'fjcontrib/**', 'pythia8/**', 'hepbundle/**', 'hepmc3/**', 'lhapdf/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-build:
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      PATH: /opt/python/cp312-cp312/bin:/opt/rh/gcc-toolset-14/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
      - run: yum install -y rsync
      - run: python -m pip install wheel pyyaml packaging auditwheel patchelf twine cmake Cython==3.3.1 abi3audit
      - run: python -m unittest discover -s wheels/tests -v
      - name: Build native payloads
        run: |
          python wheels/upgrade.py build --work build-native --cache cache --output raw-wheels
      - name: Audit and repair without duplicating native dependencies
        run: |
          python wheels/repair.py build-native raw-wheels wheelhouse
          python wheels/verify.py wheelhouse/*.whl
          abi3audit --strict wheelhouse/hepyy_lhapdf-*.whl
          python -m twine check --strict wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: native-manylinux-x86_64
          path: wheelhouse/*.whl
  linux-test:
    needs: linux-build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: matplo/hepyy
          ref: e249feb1892d94d90fa90e039d4d296e6eb0f19c
          path: hepyy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: native-manylinux-x86_64
          path: wheelhouse
      - run: python -m pip install --find-links wheelhouse './hepyy[cppyy,hepbundle]'
      - run: python wheels/test_pdf.py test-pdf
      - run: python wheels/smoke.py
        env:
          HEPYY_PACKAGES_DIR: ${{ runner.temp }}/empty-registry
          LHAPDF_DATA_PATH: ${{ github.workspace }}/test-pdf
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: matplo/hepyy
          ref: e249feb1892d94d90fa90e039d4d296e6eb0f19c
          path: hepyy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install wheel pyyaml packaging delocate twine Cython==3.3.1 abi3audit
      - run: python -m unittest discover -s wheels/tests -v
      - name: Build using the system toolchain
        run: |
          python wheels/upgrade.py build --work build-native --cache cache --output wheelhouse
          python wheels/verify.py wheelhouse/*.whl
          abi3audit --strict wheelhouse/hepyy_lhapdf-*.whl
          python -m twine check --strict wheelhouse/*.whl
          delocate-listdeps wheelhouse/hepyy_fastjet-*.whl
          delocate-listdeps wheelhouse/hepyy_pythia8-*.whl
          mv build-native build-native-hidden
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: native-test
          python-version: '3.12'
          channels: conda-forge
          conda-remove-defaults: true
      - name: Test activated conda-forge cppyy without replacing it
        shell: bash -el {0}
        run: |
          conda install -y cppyy pip
          python -m pip freeze | grep -iE 'cppyy|cling' > cppyy-before.txt
          python -m pip install --find-links wheelhouse './hepyy[hepbundle]'
          python -m pip freeze | grep -iE 'cppyy|cling' > cppyy-after.txt
          diff -u cppyy-before.txt cppyy-after.txt
          python wheels/test_pdf.py test-pdf
          LHAPDF_DATA_PATH="$PWD/test-pdf" HEPYY_PACKAGES_DIR="$RUNNER_TEMP/empty-registry" python wheels/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: wheelhouse/*.whl
