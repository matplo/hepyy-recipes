name: Publish tested native wheels
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Native wheels CI run at this exact main commit
        required: true
        type: string
      destination:
        description: Package index (requires environment approval)
        required: true
        type: choice
        options: [testpypi, pypi]
      package_set:
        description: Wheel set to promote
        type: choice
        default: hepbundle
        options: [hepbundle, jewel-cpp, glauber-cpp]
      verify_only:
        description: Verify artifacts without publishing
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.package_set == 'hepbundle'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source CI identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          run_id = os.environ['RUN_ID']
          assert run_id.isdigit(), 'run_id must be numeric'
          data = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['REPOSITORY']}/actions/runs/{run_id}"]))
          assert data['conclusion'] == 'success' and data['status'] == 'completed'
          assert data['head_sha'] == os.environ['RELEASE_SHA'], 'CI must test this exact commit'
          assert data['head_branch'] == 'main' and data['event'] == 'push'
          assert data['path'] == '.github/workflows/native-wheels.yml'
          PY
          gh run download "$RUN_ID" --repo "$REPOSITORY" --pattern 'native-*' --dir artifacts
      - name: Require protected publisher environments for every package
        env:
          GH_TOKEN: ${{ github.token }}
          DESTINATION: ${{ inputs.destination }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PYCODE'
          import json, os, subprocess, pathlib
          packages = json.loads(pathlib.Path('wheels/packages.lock.json').read_text())['packages']
          for package in packages:
              name = os.environ['DESTINATION'] + ('' if package == 'fastjet' else '-' + package)
              endpoint = f"repos/{os.environ['REPOSITORY']}/environments/{name}"
              data = json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert any(r['type']=='required_reviewers' and r.get('reviewers') for r in data['protection_rules']), name
              assert data['deployment_branch_policy']['custom_branch_policies'], name
              policies = json.loads(subprocess.check_output(['gh','api',endpoint+'/deployment-branch-policies']))['branch_policies']
              assert len(policies)==1 and policies[0]['name']=='main' and policies[0]['type']=='branch', name
          PYCODE
      - name: Validate release artifacts
        run: |
          mkdir dist
          find artifacts -type f -name '*.whl' -exec cp -n {} dist/ \;
          python -m pip install twine
          python wheels/release_check.py dist
          python -m twine check --strict dist/*
          sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: approved-native-release
          path: |
            dist/*.whl
            SHA256SUMS
  publish-fastjet:
    if: ${{ !inputs.verify_only }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: 'hepyy_fastjet', suffix: ''}
    environment: ${{ format('{0}{1}', inputs.destination, matrix.suffix) }}
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: approved-native-release
          path: release
      - name: Verify artifact checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Select this distribution
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir package-dist
          python - <<'PYCODE'
          import os, pathlib, shutil
          wheels = list(pathlib.Path('release/dist').glob(os.environ['PACKAGE'] + '-*.whl'))
          assert len(wheels) == 3, wheels
          for wheel in wheels:
              shutil.copy2(wheel, 'package-dist')
          PYCODE
      - name: Publish to TestPyPI
        if: inputs.destination == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: package-dist/
      - name: Publish to PyPI
        if: inputs.destination == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: package-dist/
  publish-libraries:
    needs: publish-fastjet
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: 'hepyy_hepmc3', suffix: '-hepmc3'}
          - {package: 'hepyy_lhapdf', suffix: '-lhapdf'}
    environment: ${{ format('{0}{1}', inputs.destination, matrix.suffix) }}
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: approved-native-release
          path: release
      - name: Verify artifact checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Select this distribution
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir package-dist
          python - <<'PYCODE'
          import os, pathlib, shutil
          wheels = list(pathlib.Path('release/dist').glob(os.environ['PACKAGE'] + '-*.whl'))
          assert len(wheels) == 3, wheels
          for wheel in wheels:
              shutil.copy2(wheel, 'package-dist')
          PYCODE
      - name: Publish to TestPyPI
        if: inputs.destination == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: package-dist/
      - name: Publish to PyPI
        if: inputs.destination == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: package-dist/
  publish-dependents:
    needs: publish-libraries
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: 'hepyy_fjcontrib', suffix: '-fjcontrib'}
          - {package: 'hepyy_pythia8', suffix: '-pythia8'}
    environment: ${{ format('{0}{1}', inputs.destination, matrix.suffix) }}
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: approved-native-release
          path: release
      - name: Verify artifact checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Select this distribution
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir package-dist
          python - <<'PYCODE'
          import os, pathlib, shutil
          wheels = list(pathlib.Path('release/dist').glob(os.environ['PACKAGE'] + '-*.whl'))
          assert len(wheels) == 3, wheels
          for wheel in wheels:
              shutil.copy2(wheel, 'package-dist')
          PYCODE
      - name: Publish to TestPyPI
        if: inputs.destination == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: package-dist/
      - name: Publish to PyPI
        if: inputs.destination == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: package-dist/
  rehearse-testpypi:
    if: inputs.destination == 'testpypi'
    needs: publish-dependents
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.10'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: macos-15, python: '3.12'}
          - {os: macos-15-intel, python: '3.12'}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: matplo/hepyy
          ref: e249feb1892d94d90fa90e039d4d296e6eb0f19c
          path: hepyy
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: ${{ matrix.python }}
      - uses: conda-incubator/setup-miniconda@v3
        if: runner.os == 'macOS'
        with:
          miniforge-version: latest
          activate-environment: native-rehearsal
          python-version: ${{ matrix.python }}
          channels: conda-forge
          conda-remove-defaults: true
      - name: Prepare runtime from normal package sources
        shell: bash -el {0}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            conda install -y cppyy pip
            python -m pip install ./hepyy
          else
            python -m pip install './hepyy[cppyy]'
          fi
          python -m pip freeze | grep -iE 'cppyy|cling' > cppyy-before.txt
      - name: Download exact native wheels from TestPyPI only
        shell: bash -el {0}
        run: |
          python -m pip install pyyaml packaging
          python wheels/upgrade.py requirements > native-requirements.txt
          python -m pip download --index-url https://test.pypi.org/simple/ --no-deps --only-binary=:all: --dest staging -r native-requirements.txt
          python -m pip install --no-index --no-deps staging/*.whl
          python -m pip freeze | grep -iE 'cppyy|cling' > cppyy-after.txt
          diff -u cppyy-before.txt cppyy-after.txt
      - name: Verify installed TestPyPI wheels
        shell: bash -el {0}
        run: |
          python wheels/test_pdf.py test-pdf
          LHAPDF_DATA_PATH="$PWD/test-pdf" HEPYY_PACKAGES_DIR="$RUNNER_TEMP/empty-rehearsal-registry" python wheels/smoke.py

  prepare-standalone:
    if: github.repository == 'matplo/hepyy-recipes' && github.ref == 'refs/heads/main' && (inputs.package_set == 'jewel-cpp' || inputs.package_set == 'glauber-cpp')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the build run and protected environment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          DESTINATION: ${{ inputs.destination }}
          PACKAGE_SET: ${{ inputs.package_set }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['REPOSITORY']}/{path}"]))

          package_set = os.environ['PACKAGE_SET']
          assert package_set in ('jewel-cpp', 'glauber-cpp')
          assert os.environ['DESTINATION'] == 'pypi', 'Use the PyPI destination for standalone wheels'
          run_id = os.environ['RUN_ID']
          assert run_id.isdigit(), 'run_id must be numeric'
          run = api(f'actions/runs/{run_id}')
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['RELEASE_SHA'], 'CI must test this exact commit'
          assert run['head_branch'] == 'main' and run['event'] in ('push', 'workflow_dispatch')
          assert run['path'] == f'.github/workflows/{package_set}-wheels.yml'

          env_path = f'environments/pypi-{package_set}'
          environment = api(env_path)
          assert any(rule['type'] == 'required_reviewers' and rule['reviewers']
                     for rule in environment['protection_rules'])
          assert environment['deployment_branch_policy']['custom_branch_policies']
          policies = api(env_path + '/deployment-branch-policies')['branch_policies']
          assert len(policies) == 1 and policies[0]['name'] == 'main' and policies[0]['type'] == 'branch'
          PY
          case "$PACKAGE_SET" in
            jewel-cpp) pattern='jewel-*' ;;
            glauber-cpp) pattern='glauber-cpp-*' ;;
          esac
          gh run download "$RUN_ID" --repo "$REPOSITORY" --pattern "$pattern" --dir artifacts
      - name: Verify the standalone release artifacts
        env:
          PACKAGE_SET: ${{ inputs.package_set }}
        run: |
          python "$PACKAGE_SET/check_wheels.py" artifacts dist
          python -m pip install twine
          python -m twine check --strict dist/*.whl
          sha256sum dist/*.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ format('approved-{0}-release', inputs.package_set) }}
          path: |
            dist/*.whl
            SHA256SUMS

  publish-standalone:
    if: ${{ !inputs.verify_only }}
    needs: prepare-standalone
    runs-on: ubuntu-24.04
    environment:
      name: ${{ format('pypi-{0}', inputs.package_set) }}
      url: ${{ format('https://pypi.org/project/hepyy-{0}/', inputs.package_set) }}
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ format('approved-{0}-release', inputs.package_set) }}
          path: release
      - name: Verify artifact checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/dist/
