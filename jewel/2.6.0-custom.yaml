name: jewel
version: "2.6.0-custom"
# Stock JEWEL 2.6.0 source (the version string above is not part of the tarball name).
url: "https://jewel.hepforge.org/downloads/?f=jewel-2.6.0.tgz"
build_system: script
# Installs the stock binaries (jewel-2.6.0-simple, jewel-2.6.0-vac) and, from the patched
# source, jewel-2.6.0-custom-simple and jewel-2.6.0-custom-vac. See 2.6.0-custom.sh for the
# patches and prefix/info/CUSTOM-PATCHES.txt after installation.
verify_binary: jewel-2.6.0-custom-vac
depends_on:
  - lhapdf

build_script: "2.6.0-custom.sh"
